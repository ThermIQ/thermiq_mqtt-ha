<svg xmlns="http://www.w3.org/2000/svg" width="430" height="600" viewBox="0 0 430 600" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>ThermIQ-MQTT config dialog</title>
  <desc>Schematic of the Heatpump config flow: Unique ID, MQTT Nodename, Language, and three checkboxes for hexformat, MQTT debug and recorder migration.</desc>

  <rect x="8" y="8" width="414" height="584" rx="10" fill="#ffffff" stroke="#e3e5e8" stroke-width="1"/>

  <text x="30" y="47" font-size="18" font-weight="500" fill="#212121">Heatpump config</text>
  <circle cx="368" cy="41" r="8.5" fill="none" stroke="#5f6368" stroke-width="1.6"/>
  <text x="368" y="45.5" font-size="11" fill="#5f6368" text-anchor="middle">?</text>
  <path d="M392 35 l12 12 M404 35 l-12 12" fill="none" stroke="#5f6368" stroke-width="1.6" stroke-linecap="round"/>

  <text x="30" y="76" font-size="13" fill="#5f6368">Set up a new ThermIQ_MQTT Instance</text>

  <rect x="30" y="92" width="370" height="52" rx="4" fill="#f4f5f7"/>
  <line x1="30" y1="144" x2="400" y2="144" stroke="#8b8f94" stroke-width="1"/>
  <text x="42" y="112" font-size="11" fill="#5f6368">Unique ID *</text>
  <text x="42" y="133" font-size="14" fill="#212121">vp1</text>

  <rect x="30" y="156" width="370" height="52" rx="4" fill="#f4f5f7"/>
  <line x1="30" y1="208" x2="400" y2="208" stroke="#8b8f94" stroke-width="1"/>
  <text x="42" y="176" font-size="11" fill="#5f6368">MQTT Nodename *</text>
  <text x="42" y="197" font-size="14" fill="#212121">ThermIQ/ThermIQ-mqtt</text>

  <rect x="30" y="220" width="370" height="52" rx="4" fill="#f4f5f7"/>
  <line x1="30" y1="272" x2="400" y2="272" stroke="#8b8f94" stroke-width="1"/>
  <text x="42" y="240" font-size="11" fill="#5f6368">Language *</text>
  <text x="42" y="261" font-size="14" fill="#212121">en</text>
  <path d="M374 249 l7 8 l7 -8" fill="none" stroke="#5f6368" stroke-width="1.6" stroke-linecap="round"/>

  <rect x="31" y="300" width="17" height="17" rx="2.5" fill="#ffffff" stroke="#6b7075" stroke-width="1.5"/>
  <text x="60" y="313" font-size="13" fill="#212121">Use hexformat for registers in MQTT</text>

  <rect x="31" y="340" width="17" height="17" rx="2.5" fill="#ffffff" stroke="#6b7075" stroke-width="1.5"/>
  <text x="60" y="353" font-size="13" fill="#212121">Enable MQTT debug by adding '_dbg' to</text>
  <text x="60" y="371" font-size="13" fill="#212121">Nodename</text>

  <rect x="31" y="398" width="17" height="17" rx="2.5" fill="#ffffff" stroke="#6b7075" stroke-width="1.5"/>
  <text x="60" y="411" font-size="13" fill="#212121">Request migration of old data in recorder</text>
  <text x="60" y="429" font-size="13" fill="#212121">database (may take time)</text>

  <text x="400" y="560" font-size="14" font-weight="500" fill="#03a9f4" text-anchor="end">SUBMIT</text>
</svg>
